title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/fixtures''',
  '''node_modules''',
  '''dist''',
  '''coverage''',
  '''.*\.log$''',
  '''package-lock\.json$''',
]

# Rule-specific allowlists for known false positives
[[rules]]
id = "generic-api-key"
description = "Generic API Key - false positive for test fixtures"
[rules.allowlist]
paths = [
  '''tests/.*\.test\.ts$''',
  '''tests/fixtures/.*''',
]

[[rules]]
id = "private-key"
description = "Private Key - false positive for test certificates"
[rules.allowlist]
paths = [
  '''tests/fixtures/.*\.pem$''',
  '''testdata/.*\.pem$''',
]
