# Geode Node.js Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog for standardized components
# https://gitlab.com/devnw/ci-catalog

default:
  tags:
    - company
    - linux

stages:
  - install
  - lint
  - build
  - test
  - security
  - sbom
  - publish
  - release

# =============================================================================
# Include DevNW CI/CD Catalog Components
# =============================================================================

include:
  # Node.js components
  - component: gitlab.com/devnw/ci-catalog/node-install@~latest
    inputs:
      stage: install
      node_version: '20'

  - component: gitlab.com/devnw/ci-catalog/node-lint@~latest
    inputs:
      stage: lint
      node_version: '20'
      lint_script: 'lint'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-format@~latest
    inputs:
      stage: lint
      node_version: '20'
      format_script: 'format:check'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-typecheck@~latest
    inputs:
      stage: lint
      node_version: '20'
      typecheck_script: 'typecheck'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-build@~latest
    inputs:
      stage: build
      node_version: '20'
      build_script: 'build'
      output_dir: 'dist'

  - component: gitlab.com/devnw/ci-catalog/node-test@~latest
    inputs:
      stage: test
      node_version: '20'
      test_script: 'test:coverage'
      coverage_report: true
      coverage_path: 'coverage/cobertura-coverage.xml'

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@~latest

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@~latest

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@~latest
    inputs:
      allow_failure: true

  # Publishing with OIDC trusted publishing (only on tags)
  # Requires trusted publisher configured on npmjs.com
  - component: gitlab.com/devnw/ci-catalog/node-publish@v1.9.8
    inputs:
      stage: publish
      node_version: '22'
      package_scope: '@geodedb'
      access: 'public'
      environment: 'npm-publish'

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.9.3
    inputs:
      stage: release

# =============================================================================
# Job Overrides and Customizations
# =============================================================================

# Override publish rules to only trigger on version tags (including pre-releases)
node-publish-npm:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: manual
    - when: never

node-publish-gitlab:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never
