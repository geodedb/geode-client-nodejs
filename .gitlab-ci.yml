# Geode Node.js Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog for standardized components
# https://gitlab.com/devnw/ci-catalog
#
# SECURITY: All component versions are pinned to prevent supply chain attacks.
# Update versions explicitly after security review.

workflow:
  # SRE-172: a newer commit on the same ref cancels the superseded pipeline's
  # interruptible (validation) jobs. Release/deploy jobs stay non-interruptible.
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible

default:
  tags:
    - company
    - linux

stages:
  - install
  - lint
  - build
  - test
  - security
  - sbom
  - publish
  - release

# =============================================================================
# Include DevNW CI/CD Catalog Components
# =============================================================================

include:
  # Node.js components - pinned versions
  - component: gitlab.com/devnw/ci-catalog/node-install@v1.57.0
    inputs:
      stage: install
      node_version: '24'

  - component: gitlab.com/devnw/ci-catalog/node-lint@v1.57.0
    inputs:
      stage: lint
      node_version: '24'
      lint_script: 'lint'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-format@v1.57.0
    inputs:
      stage: lint
      node_version: '24'
      format_script: 'format:check'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-typecheck@v1.57.0
    inputs:
      stage: lint
      node_version: '24'
      typecheck_script: 'typecheck'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-build@v1.57.0
    inputs:
      stage: build
      node_version: '24'
      build_script: 'build'
      output_dir: 'dist'

  - component: gitlab.com/devnw/ci-catalog/node-test@v1.57.0
    inputs:
      stage: test
      node_version: '24'
      test_script: 'test:coverage'
      coverage_report: true
      coverage_path: 'coverage/cobertura-coverage.xml'

  # Security scanning - pinned versions
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.57.0

  # SBOM generation and scanning - pinned versions
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.57.0

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.57.0
    inputs:
      allow_failure: false

  # Publishing with OIDC trusted publishing (only on tags)
  # Requires trusted publisher configured on npmjs.com
  - component: gitlab.com/devnw/ci-catalog/node-publish@v1.57.0
    inputs:
      stage: publish
      # node 24: the component upgrades to npm@12 for OIDC publishing, which
      # requires node >=22.22.2 / >=24.15.0; the node:22 image lags at 22.22.0
      node_version: '24'
      package_scope: '@geodedb'
      access: 'public'
      environment: 'npm-publish'
      provenance: false  # Requires GitLab-hosted runners; self-hosted runners not supported

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.57.0
    inputs:
      stage: release

# =============================================================================
# Job Overrides and Customizations
# =============================================================================

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  allow_failure: true

# Packaging regression gate: `npm pack` from a simulated clean checkout must
# emit a tarball containing dist/. Guards the v1.3.1 dist-less tarball defect
# (prepublishOnly does not run for `npm pack`; prepack does).
pack-verify:
  interruptible: true
  stage: test
  image: node:26
  needs:
    - job: node-install-24
      optional: true
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
  script:
    - npm ci
    - npx vitest run tests/unit/pack-verify.test.ts
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

# Override publish rules to only trigger on version tags (including pre-releases)
# NOTE: `needs:` replaces the component default (node-build) wholesale, so the
# original dependency is restated alongside the pack-verify gate.
node-publish-npm:
  needs:
    - job: node-build
      optional: true
    - job: pack-verify
      optional: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never

node-publish-gitlab:
  needs:
    - job: node-build
      optional: true
    - job: pack-verify
      optional: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never

# Release must wait for publish to complete
create-release:
  needs:
    - job: node-publish-npm
      optional: false
    - job: node-publish-gitlab
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never
