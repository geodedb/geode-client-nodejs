# Geode Node.js Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog for standardized components
# https://gitlab.com/devnw/ci-catalog
#
# SECURITY: All component versions are pinned to prevent supply chain attacks.
# Update versions explicitly after security review.

default:
  tags:
    - company
    - linux

stages:
  - install
  - lint
  - build
  - test
  - security
  - sbom
  - publish
  - release

# =============================================================================
# Include DevNW CI/CD Catalog Components
# =============================================================================

include:
  # Node.js components - pinned versions
  - component: gitlab.com/devnw/ci-catalog/node-install@v1.43.0
    inputs:
      stage: install
      node_version: '20'

  - component: gitlab.com/devnw/ci-catalog/node-lint@v1.43.0
    inputs:
      stage: lint
      node_version: '20'
      lint_script: 'lint'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-format@v1.43.0
    inputs:
      stage: lint
      node_version: '20'
      format_script: 'format:check'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-typecheck@v1.43.0
    inputs:
      stage: lint
      node_version: '20'
      typecheck_script: 'typecheck'
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/node-build@v1.43.0
    inputs:
      stage: build
      node_version: '20'
      build_script: 'build'
      output_dir: 'dist'

  - component: gitlab.com/devnw/ci-catalog/node-test@v1.43.0
    inputs:
      stage: test
      node_version: '20'
      test_script: 'test:coverage'
      coverage_report: true
      coverage_path: 'coverage/cobertura-coverage.xml'

  # Security scanning - pinned versions
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.43.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.43.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.43.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.43.0

  # SBOM generation and scanning - pinned versions
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.43.0

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.43.0
    inputs:
      allow_failure: false

  # Publishing with OIDC trusted publishing (only on tags)
  # Requires trusted publisher configured on npmjs.com
  - component: gitlab.com/devnw/ci-catalog/node-publish@v1.43.0
    inputs:
      stage: publish
      node_version: '22'
      package_scope: '@geodedb'
      access: 'public'
      environment: 'npm-publish'
      provenance: false  # Requires GitLab-hosted runners; self-hosted runners not supported

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.43.0
    inputs:
      stage: release

# =============================================================================
# Job Overrides and Customizations
# =============================================================================

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  allow_failure: true

# Override publish rules to only trigger on version tags (including pre-releases)
node-publish-npm:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never

node-publish-gitlab:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never

# Release must wait for publish to complete
create-release:
  needs:
    - job: node-publish-npm
      optional: false
    - job: node-publish-gitlab
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/
      when: on_success
    - when: never
